<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trading Calculator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles/theme.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-title">Trading Calculator</span>
        <span id="env-badge" class="env-badge">Test Mode</span>
      </div>
      <div class="market-switch" role="tablist" aria-label="Select Market">
        <button type="button" class="market-btn" data-market="crypto">Crypto Futures</button>
        <button type="button" class="market-btn" data-market="forex">Forex &amp; Gold</button>
      </div>
    </header>

    <nav id="tab-bar" class="tab-bar" role="tablist"></nav>

    <main id="module-root" class="module-root"></main>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
